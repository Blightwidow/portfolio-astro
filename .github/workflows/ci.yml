name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - run: bun install --frozen-lockfile

      - name: Format
        run: bun run format

      - name: Tests
        run: bun test scripts

      # Runs astro check, lint, astro build and pagefind, in that order, stopping at the first
      # failure. The prebuild hook downloads the pinned chess engine.
      - name: Build
        run: bun run build
