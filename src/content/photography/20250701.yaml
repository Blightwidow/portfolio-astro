description: >
  The coast is littered with abandonned huts like these. It felt like they were so cosy when working.
  The thought of staying there, with the sea as you only view through the door and window, and the rolling sound of wave
  made me understand the desire to leave here. I was kinda curious why they were all abandonned though.
