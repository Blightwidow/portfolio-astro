alt: A woman sitting alone on stone amphitheater steps beneath an autumn tree
description: >
  My favorite shot of the trip. I was attracted by this stranger just sitting by this tree. I felt the colors and 
  light was beautiful, while she just didn't care about it. The colors of autunm also pop out beautifully.
  I am just sad I didn't have a tighter lens for this.
