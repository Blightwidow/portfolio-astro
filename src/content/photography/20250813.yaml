description: >
  A quiet cobbled alley in a whitewashed old town, with someone taking a break on a doorstep. The light bouncing between the walls made the whole street glow, and the little flower balcony was the cherry on top. I still struggled to get everything exposed correctly, but that's also how it is with film.
