description: >
  There is an old lift to go to the top of the city that was built for the 68 olympics.
  It's shaped like a bubbles floating and is pretty iconnic of the city of Grenoble.
  I wanted to take some scenary photos from it, but couldn't find any angles I liked.
  In the end my favorite picture of the bunch was the contrast between the cool view and 
  the other occupant glued to her phone instead of admiring it.
