title: tree tunnel
alt: A tree-canopied street in dappled light, a couple walking their dog along the sidewalk
description: >
  A narrow street where the trees on both sides meet overhead, turning the whole block into a tunnel of leaves. The harsh midday sun filtering through gave me these deep shadows I love on black and white film.
